server:
  port: ${PORT:8080}

spring:
  application:
    name: taller-ebbenezer-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tallerdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 240000
      connection-timeout: 20000
      validation-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:cambia-esta-clave-por-una-segura-de-al-menos-256-bits}
  expiration-ms: 86400000